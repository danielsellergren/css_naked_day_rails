name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly, to catch breakage from new Rails and Ruby releases.
    - cron: "0 12 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rails: "5.0", ruby: "2.7", gemfile: rails_5_0 }
          - { rails: "5.1", ruby: "2.7", gemfile: rails_5_1 }
          - { rails: "5.2", ruby: "2.7", gemfile: rails_5_2 }
          - { rails: "6.0", ruby: "2.7", gemfile: rails_6_0 }
          - { rails: "6.1", ruby: "3.0", gemfile: rails_6_1 }
          - { rails: "7.0", ruby: "3.1", gemfile: rails_7_0 }
          - { rails: "7.1", ruby: "3.2", gemfile: rails_7_1 }
          - { rails: "7.2", ruby: "3.3", gemfile: rails_7_2 }
          - { rails: "8.0", ruby: "3.4", gemfile: rails_8_0 }
          - { rails: "8.1", ruby: "3.4", gemfile: rails_8_1 }
          - { rails: "8.1", ruby: "4.0", gemfile: rails_8_1 }
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
